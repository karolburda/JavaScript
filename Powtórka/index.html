<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>
    <style>
        header{
            text-align: center;
        }
        form{
            text-align: center;
        }
        aside{
            text-align: center;
        }
        footer{
            text-align: center;
        }
        
    </style>
</head>
<body>

    <header>
        <h1>Formularz</h1>
    </header>

    <main>
        <form name="formularz" id="form">
            <p>Imię <input type="text" name="imie"></p>
            <p>Wiek <input type="number" name="wiek"></p>
            <p><input type="checkbox" name="zgoda"> Czy wyrażasz zgodę na przetwarzanie danych?</p>
            <input type="button" value="Prześlij" onclick="ankieta()">
        </form>
    </main>

    <aside id="1">
        
    </aside>

    <footer>
        <h5>Stopka</h5>
    </footer>

    <script>
        let imie1=document.forms.formularz.imie.value
        let wiek1=document.forms.formularz.wiek.value
        let zgoda1=document.forms.formularz.zgoda.value

        function ankieta () {
            if (document.forms.formularz.zgoda.checked){
                document.getElementById("1").innerHTML+= imie1+" ma "+wiek1+" lat i wyraził zgodę na przetwarzanie danych<br>"
            } else {
                document.getElementById("1").innerHTML+= imie1+" ma "+wiek1+" lat i nie wyraził zgody na przetwarzanie danych<br>"
            }
        }
    </script>

</body>
</html>

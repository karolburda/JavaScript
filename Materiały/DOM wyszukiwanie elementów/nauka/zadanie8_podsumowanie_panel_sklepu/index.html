<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauka – podsumowanie panel sklepu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1 id="nazwa">Sklep</h1>
    </div>
    <div class="produkt">
        <p>Nazwa: <span class="nazwa">chleb</span></p>
        <p>Cena: <span class="cena">4.50</span></p>
    </div>
    <div class="produkt promocja">
        <p>Nazwa: <span class="nazwa">sok</span></p>
        <p>Cena: <span class="cena">6.00</span></p>
    </div>
    <div class="card">
        <h2>Godziny</h2>
        <ul id="godziny">
            <li>Pn–Pt 8–16</li>
            <li>Sb 9–13</li>
            <li>Nd nieczynne</li>
        </ul>
    </div>
    <footer><p>Imię i nazwisko, klasa</p></footer>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 2 – getElementsByClassName</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Panel kart informacyjnych</h1>

    <div class="kontener">
        <div class="karta">
            <h2>Karta 1</h2>
            <p>Treść pierwszej karty.</p>
        </div>
        <div class="karta wyroznienie">
            <h2>Karta 2</h2>
            <p>Ta karta jest wyróżniona.</p>
        </div>
        <div class="karta">
            <h2>Karta 3</h2>
            <p>Treść trzeciej karty.</p>
        </div>
        <div class="karta wyroznienie">
            <h2>Karta 4</h2>
            <p>Ta karta również jest wyróżniona.</p>
        </div>
        <div class="karta">
            <h2>Karta 5</h2>
            <p>Treść piątej karty.</p>
        </div>
    </div>

    <script src="script.js"></script>

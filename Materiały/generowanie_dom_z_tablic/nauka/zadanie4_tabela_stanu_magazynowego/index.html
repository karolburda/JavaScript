</head>
<body>

    <header>
      <h1>Kontrola Stanów Magazynowych Hurtowni</h1>

    <main>
      <section class="sekcja-tabeli">
        <table id="tabela-danych">
          <thead>
            <tr>
              <th>Nazwa towaru</th>
              <th>Dostępna ilość</th>
              <th>Cena jednostkowa</th>

          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="sekcja-raportu">
        <p id="podsumowanie" class="raport-statusu">Liczba pozycji wymagających zamówienia: 0</p>
      </section>

    <footer>
      <p>INF.03 · PAI · XXI c.</p>
    </footer>

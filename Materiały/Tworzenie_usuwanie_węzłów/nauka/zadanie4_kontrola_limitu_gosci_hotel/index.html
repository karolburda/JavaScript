<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>System Rezerwacji Hotelowej</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Recepcja Hotelu Grand</h1>
  </header>
  <main>
    <section class="karta">
      <h2>Zameldowanie gości hotelowych (Maksymalnie 5 pokoi)</h2>
      <div id="komunikat-limitu"></div>
      <div class="form-grupa">
        <label for="nazwisko-goscia">Nazwisko gościa:</label>
        <input type="text" id="nazwisko-goscia" placeholder="np. Kowalski">
      </div>
      <button id="btn-zamelduj" type="button">Zamelduj gościa</button>
      <h3>Lista zajętych pokoi:</h3>
      <ul id="lista-gosci" class="lista">
        <li class="wpis-rezerwacji">Gość hotelowy: Nowak</li>
        <li class="wpis-rezerwacji">Gość hotelowy: Wiśniewski</li>
      </ul>
    </section>
  </main>
  <footer>
    <p>INF.03 · PAI · XXI c.</p>
  </footer>
</body>
</html>

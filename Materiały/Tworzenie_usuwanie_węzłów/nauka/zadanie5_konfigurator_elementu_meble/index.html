<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Konfigurator Mebli Biurowych</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Salon Wyposażenia Biur</h1>
  </header>
  <main>
    <section class="karta">
      <h2>Kreator specyfikacji mebli</h2>
      <div class="form-grupa">
        <label for="typ-mebla">Kategoria mebla:</label>
        <select id="typ-mebla">
          <option value="Biurko ergonomiczne">Biurko ergonomiczne</option>
          <option value="Fotel obrotowy">Fotel obrotowy</option>
          <option value="Regał modułowy">Regał modułowy</option>
        </select>
      </div>
      <div class="form-grupa">
        <label>Wybierz materiał wykończenia:</label>
        <div class="radio-grupa">
          <label class="radio-opcja"><input type="radio" name="material" value="Dąb naturalny" checked> Dąb naturalny</label>
          <label class="radio-opcja"><input type="radio" name="material" value="Czarny mat"> Czarny mat</label>
          <label class="radio-opcja"><input type="radio" name="material" value="Szary antracyt"> Szary antracyt</label>
        </div>
      </div>
      <button id="btn-dodaj-konfiguracje" type="button">Dodaj do zestawienia</button>
      <h3>Zestawienie skonfigurowanych pozycji:</h3>
      <div id="zestawienie-mebli" class="zestawienie"></div>
    </section>
  </main>
  <footer>
    <p>INF.03 · PAI · XXI c.</p>
  </footer>
</body>
</html>

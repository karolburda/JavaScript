<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kreator Etykiet Promocyjnych Sklepu</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Kreator Etykiet Sklepowych</h1>
  </header>
  <main>
    <section class="karta">
      <h2>Generowanie etykiety z rabatem</h2>
      <div class="form-grupa">
        <label for="wartosc-rabatu">Wartość rabatu (%):</label>
        <input type="number" id="wartosc-rabatu" min="1" max="90" value="15">
      </div>
      <button id="btn-dodaj-etykiete" type="button">Dodaj etykietę</button>
      <div id="kontener-etykiet" class="kontener-tagow">
        <span class="etykieta-rabatu">Rabat specjalny: -10% na całą kategorię</span>
      </div>
    </section>
  </main>
  <footer>
    <p>INF.03 · PAI · XXI c.</p>
  </footer>
</body>
</html>

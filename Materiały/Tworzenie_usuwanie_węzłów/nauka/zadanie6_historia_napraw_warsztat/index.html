<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dziennik Napraw Warsztatu Samochodowego</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Serwis Pojazdów Auto-Moto</h1>
  </header>
  <main>
    <section class="karta">
      <h2>Dziennik wykonanych napraw</h2>
      <div class="form-grupa">
        <label for="opis-naprawy">Opis wykonanej naprawy:</label>
        <input type="text" id="opis-naprawy" placeholder="np. Wymiana filtrów oleju">
      </div>
      <div class="przyciski-akcji">
        <button id="btn-dodaj-naprawe" type="button">Dodaj naprawę</button>
        <button id="btn-resetuj-historie" type="button">Wyczyść całą historię</button>
      </div>
      <h3>Historia serwisowa:</h3>
      <div id="historia-napraw" class="lista-napraw">
        <p class="stan-pusty">Brak zarejestrowanych napraw w bieżącej sesji warsztatu.</p>
      </div>
    </section>
  </main>
  <footer>
    <p>INF.03 · PAI · XXI c.</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Rejestracja Poradni VitaMed</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Rejestracja Poradni VitaMed</h1>
  </header>
  <main>
    <section class="karta">
      <h2>Rejestracja przyjęć pacjentów</h2>
      <div class="form-grupa">
        <label for="wybor-poradni">Wybierz gabinet specjalistyczny:</label>
        <select id="wybor-poradni">
          <option value="Gabinet Internistyczny">Gabinet Internistyczny</option>
          <option value="Gabinet Kardiologiczny">Gabinet Kardiologiczny</option>
          <option value="Gabinet Okulistyczny">Gabinet Okulistyczny</option>
        </select>
      </div>
      <button id="btn-zarejestruj" type="button">Zarejestruj wizytę</button>
      <div id="rejestr-wizyt" class="lista">
        <p class="wpis-medyczny">Dyżur rejestracji rozpoczęty pomyślnie.</p>
      </div>
    </section>
  </main>
  <footer>
    <p>INF.03 · PAI · XXI c.</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Pakietów Badań Medycznych</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Kalkulator Pakietów Badań Medycznych</h1>
  </header>
  <main>
    <section class="karta">
      <h2>Konfiguracja koszyka badań diagnostycznych</h2>
      <div class="form-grid">
        <div class="form-grupa">
          <label for="wybor-badania">Badanie laboratoryjne:</label>
          <select id="wybor-badania">
            <option value="Morfologia krwi pełna">Morfologia krwi pełna</option>
            <option value="Profil lipidowy (Lipidogram)">Profil lipidowy (Lipidogram)</option>
            <option value="Próby wątrobowe ALT/AST">Próby wątrobowe ALT/AST</option>
            <option value="Panel tarczycowy TSH">Panel tarczycowy TSH</option>
          </select>
        </div>
        <div class="form-grupa">
          <label for="cena-badania">Cena badania (zł):</label>
          <input type="number" id="cena-badania" min="10" step="5" value="45">
        </div>
      </div>
      <button id="btn-dodaj-badanie" type="button">Dodaj badanie do pakietu</button>
      <h3>Wybrane procedury diagnostyczne:</h3>
      <ul id="lista-badan" class="lista"></ul>
      <div id="suma-badan" class="podsumowanie">Łączny koszt badań laboratoryjnych: 0 zł</div>
    </section>
  </main>
  <footer>
    <p>INF.03 · PAI · XXI c.</p>
  </footer>
</body>
</html>
